---
layout: default
---

<h1>墨小曦的Blog</h1>

<div style="text-align: center; margin: 3rem 0; font-style: italic; color: #888;">
  <p>「会泽百家，至公天下」</p>
  <p>—— 云南大学校训</p>
</div>

<div class="ink-divider" style="margin: 3rem auto;"></div>

<section style="margin: 3rem 0;">
  <h2 style="text-align: center;">近期文章</h2>

  <ul class="post-list">
    {% for post in site.posts %}
      <li>
        <div class="post-meta">{{ post.date | date: "%Y年%m月%d日" }}</div>
        <a href="{{ post.url | relative_url }}" class="post-link">{{ post.title }}</a>
      </li>
    {% endfor %}
  </ul>
</section>

<div style="margin-top: 4rem; padding: 2rem; background: #2a2a2a; border-radius: 8px; text-align: center; border: 1px solid #3a3a3a;">
  <p style="text-indent: 0; margin-bottom: 1rem;">欢迎来到墨小曦的Blog</p>
  <p style="text-indent: 0; color: #666; font-size: 0.9rem;">在这里记录学习心得，分享生活感悟</p>
</div>
