---
layout: default
---

<h1>近期文章</h1>

<div class="intro-box">
  <p>墨香浮动 · 记录成长</p>
</div>

<ul class="post-list">
  {% for post in site.posts %}
    <li>
      <div class="post-meta">{{ post.date | date: "%Y年%m月%d日" }}</div>
      <a href="{{ post.url | relative_url }}" class="post-link">{{ post.title }}</a>
    </li>
  {% endfor %}
</ul>

<div class="intro-box" style="margin-top: 3rem;">
  <p>欢迎来到墨小曦的Blog</p>
  <p style="font-size: 0.9rem; color: #888;">在这里记录学习心得，分享生活感悟</p>
</div>
