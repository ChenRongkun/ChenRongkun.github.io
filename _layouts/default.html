<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600;700&family=ZCOOL+XiaoWei&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Noto Serif SC', serif;
        background: #f5f1eb;
        color: #2a2a2a;
        line-height: 2;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.08;
        pointer-events: none;
        z-index: 0;
      }

      .landscape {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 100vh;
        z-index: 0;
        overflow: hidden;
        background: linear-gradient(180deg,
          #87ceeb 0%,
          #b0d4e8 15%,
          #d4e4ed 30%,
          #e8e0d5 50%,
          #d0c8b8 60%,
          #c0b8a0 75%,
          #a8a090 100%
        );
      }

      .mountain {
        position: absolute;
        bottom: 0;
        width: 100%;
      }

      .mountain-far {
        height: 50%;
        background: 
          radial-gradient(ellipse 80% 60% at 20% 80%, rgba(150, 165, 175, 0.6) 0%, transparent 50%),
          radial-gradient(ellipse 60% 40% at 70% 75%, rgba(160, 170, 180, 0.5) 0%, transparent 45%),
          radial-gradient(ellipse 90% 50% at 50% 85%, rgba(180, 185, 190, 0.4) 0%, transparent 50%),
          linear-gradient(180deg, 
            #9eb8c9 0%,
            #8aa8b8 15%,
            #7a9aa8 30%,
            #6a8c9a 45%,
            #5a7e8c 60%,
            #4a7080 75%,
            #3a6270 100%
          );
      }

      .mountain-far::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: 
          url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.02' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.15'/%3E%3C/svg%3E");
        mix-blend-mode: overlay;
      }

      .mountain-mid {
        height: 42%;
        background: 
          radial-gradient(ellipse 70% 50% at 30% 70%, rgba(100, 110, 100, 0.4) 0%, transparent 40%),
          radial-gradient(ellipse 50% 35% at 75% 65%, rgba(90, 100, 95, 0.35) 0%, transparent 35%),
          linear-gradient(175deg, 
            #6b7b6a 0%,
            #5a6b5a 12%,
            #4a5b4a 28%,
            #3a4b3a 45%,
            #2a3b2a 62%,
            #1a2b1a 80%,
            #0a1b0a 100%
          );
        clip-path: polygon(
          0% 100%,
          0% 55%,
          6% 48%,
          12% 52%,
          18% 45%,
          24% 40%,
          30% 38%,
          36% 42%,
          42% 35%,
          48% 30%,
          54% 28%,
          60% 32%,
          66% 28%,
          72% 25%,
          78% 30%,
          84% 28%,
          90% 32%,
          96% 30%,
          100% 28%,
          100% 100%
        );
      }

      .mountain-mid::before {
        content: '';
        position: absolute;
        top: 10%;
        left: 15%;
        width: 8%;
        height: 15%;
        background: radial-gradient(ellipse, rgba(255,255,255,0.3) 0%, transparent 70%);
        filter: blur(3px);
      }

      .mountain-near {
        height: 35%;
        background: 
          radial-gradient(ellipse 60% 40% at 40% 60%, rgba(60, 70, 50, 0.5) 0%, transparent 45%),
          radial-gradient(ellipse 45% 30% at 80% 55%, rgba(50, 60, 45, 0.4) 0%, transparent 40%),
          linear-gradient(180deg, 
            #2a3a28 0%,
            #1a2a1a 20%,
            #0a1a0a 50%,
            #050f05 100%
          );
        clip-path: polygon(
          0% 100%,
          0% 50%,
          8% 42%,
          15% 38%,
          22% 35%,
          30% 32%,
          38% 28%,
          46% 25%,
          54% 22%,
          62% 25%,
          70% 22%,
          78% 20%,
          86% 22%,
          94% 20%,
          100% 18%,
          100% 100%
        );
      }

      .water {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 18%;
        background: linear-gradient(180deg,
          rgba(100, 130, 145, 0.5) 0%,
          rgba(85, 120, 140, 0.6) 30%,
          rgba(70, 110, 135, 0.7) 60%,
          rgba(55, 100, 130, 0.8) 100%
        );
      }

      .water::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 40%;
        background: 
          repeating-linear-gradient(
            85deg,
            transparent,
            transparent 15px,
            rgba(255,255,255,0.08) 15px,
            rgba(255,255,255,0.08) 18px,
            transparent 18px,
            transparent 35px
          ),
          repeating-linear-gradient(
            95deg,
            transparent,
            transparent 25px,
            rgba(255,255,255,0.05) 25px,
            rgba(255,255,255,0.05) 28px,
            transparent 28px,
            transparent 50px
          );
        animation: water-flow 8s linear infinite;
      }

      .water::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 30%;
        background: linear-gradient(180deg,
          transparent 0%,
          rgba(0,0,0,0.15) 100%
        );
      }

      @keyframes water-flow {
        0% { transform: translateX(0); }
        100% { transform: translateX(30px); }
      }

      .sun {
        position: absolute;
        top: 8%;
        right: 15%;
        width: 80px;
        height: 80px;
        background: 
          radial-gradient(circle at 40% 40%,
            #fff8e0 0%,
            #ffeeba 15%,
            #ffd070 30%,
            #ffb030 45%,
            #ff8c00 60%,
            #e06000 75%,
            #c04000 90%,
            transparent 95%
          );
        border-radius: 50%;
        box-shadow: 
          0 0 60px 15px rgba(255, 180, 80, 0.5),
          0 0 100px 30px rgba(255, 150, 50, 0.3),
          0 0 150px 50px rgba(255, 120, 30, 0.15);
      }

      .sun::before {
        content: '';
        position: absolute;
        top: -20%;
        left: -20%;
        right: -20%;
        bottom: -20%;
        background: 
          radial-gradient(circle, 
            rgba(255, 240, 200, 0.3) 0%, 
            rgba(255, 220, 150, 0.15) 30%,
            transparent 50%
          );
        border-radius: 50%;
      }

      .cloud {
        position: absolute;
        background: linear-gradient(180deg,
          rgba(255,255,255,0.95) 0%,
          rgba(245,245,250,0.9) 50%,
          rgba(235,235,240,0.85) 100%
        );
        border-radius: 50%;
        filter: blur(2px);
      }

      .cloud-1 {
        top: 8%;
        left: 5%;
        width: 150px;
        height: 40px;
        filter: blur(4px);
        opacity: 0.8;
      }

      .cloud-1::before,
      .cloud-1::after {
        content: '';
        position: absolute;
        background: inherit;
        border-radius: 50%;
      }

      .cloud-1::before {
        top: -20px;
        left: 30px;
        width: 80px;
        height: 35px;
      }

      .cloud-1::after {
        top: -15px;
        left: 70px;
        width: 60px;
        height: 30px;
      }

      .cloud-2 {
        top: 15%;
        left: 20%;
        width: 100px;
        height: 30px;
        filter: blur(5px);
        opacity: 0.6;
      }

      .cloud-3 {
        top: 5%;
        right: 35%;
        width: 120px;
        height: 35px;
        filter: blur(3px);
        opacity: 0.7;
      }

      .cloud-4 {
        top: 18%;
        right: 8%;
        width: 80px;
        height: 25px;
        filter: blur(4px);
        opacity: 0.5;
      }

      .mist {
        position: absolute;
        bottom: 30%;
        left: 0;
        right: 0;
        height: 20%;
        background: linear-gradient(180deg,
          transparent 0%,
          rgba(220, 225, 230, 0.6) 30%,
          rgba(210, 220, 225, 0.75) 50%,
          rgba(200, 215, 220, 0.65) 70%,
          transparent 100%
        );
        filter: blur(3px);
      }

      .mist::before,
      .mist::after {
        content: '';
        position: absolute;
        background: inherit;
        filter: blur(5px);
      }

      .mist::before {
        top: 20%;
        left: 10%;
        width: 40%;
        height: 60%;
        opacity: 0.5;
      }

      .mist::after {
        top: 30%;
        right: 15%;
        width: 35%;
        height: 50%;
        opacity: 0.4;
      }

      .pine {
        position: absolute;
        bottom: 32%;
        right: 10%;
        width: 6px;
        height: 80px;
        background: linear-gradient(180deg, #1a1510 0%, #0a0805 100%);
      }

      .pine::before {
        content: '';
        position: absolute;
        top: -50px;
        left: -35px;
        width: 80px;
        height: 60px;
        background: 
          radial-gradient(ellipse 100% 60% at 50% 100%,
            #1a2515 0%,
            #152015 30%,
            #0a150a 70%,
            transparent 100%
          );
        clip-path: polygon(
          50% 0%,
          20% 35%,
          35% 35%,
          10% 60%,
          30% 60%,
          5% 85%,
          95% 85%,
          70% 60%,
          90% 60%,
          65% 35%,
          80% 35%
        );
      }

      .pine::after {
        content: '';
        position: absolute;
        top: -90px;
        left: -25px;
        width: 60px;
        height: 45px;
        background: 
          radial-gradient(ellipse 100% 60% at 50% 100%,
            rgba(30, 40, 25, 0.9) 0%,
            rgba(20, 30, 18, 0.7) 50%,
            transparent 100%
          );
        clip-path: polygon(
          50% 0%,
          25% 30%,
          40% 30%,
          15% 55%,
          35% 55%,
          10% 80%,
          90% 80%,
          65% 55%,
          85% 55%,
          60% 30%,
          75% 30%
        );
      }

      .seal {
        position: absolute;
        bottom: 38%;
        left: 6%;
        width: 50px;
        height: 50px;
        background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%);
        border-radius: 3px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 1.4rem;
        color: #f5f1eb;
        writing-mode: vertical-rl;
        text-orientation: upright;
        letter-spacing: 3px;
        box-shadow: 
          2px 2px 4px rgba(0,0,0,0.4),
          inset 1px 1px 2px rgba(255,255,255,0.1);
        transform: rotate(-3deg);
        border: 1px solid rgba(0,0,0,0.3);
      }

      .seal::before {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        right: 3px;
        bottom: 3px;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 2px;
      }

      .content-wrapper {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 2rem 2rem 1rem;
        text-align: center;
        background: linear-gradient(180deg, 
          rgba(245, 241, 235, 0.95) 0%,
          rgba(245, 241, 235, 0.8) 50%,
          transparent 100%
        );
      }

      .site-title {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 3.5rem;
        color: #1a1a18;
        letter-spacing: 0.8rem;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        margin-bottom: 0.5rem;
      }

      .site-subtitle {
        font-family: 'ZCOOL XiaoWei', serif;
        font-size: 1rem;
        color: #5a5248;
        letter-spacing: 0.4rem;
      }

      nav {
        display: flex;
        justify-content: center;
        gap: 2.5rem;
        margin-top: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid rgba(90, 82, 72, 0.2);
      }

      nav a {
        text-decoration: none;
        color: #4a4238;
        font-size: 1.05rem;
        padding: 0.3rem 1rem;
        position: relative;
        transition: all 0.3s ease;
      }

      nav a::before {
        content: '〇';
        position: absolute;
        left: -1.2rem;
        color: #8b4513;
        opacity: 0.5;
        transition: all 0.3s ease;
      }

      nav a:hover {
        color: #c41e3a;
      }

      nav a:hover::before {
        content: '●';
        color: #c41e3a;
        opacity: 1;
      }

      main {
        flex: 1;
        max-width: 800px;
        margin: 2rem auto;
        padding: 2.5rem 2rem;
        background: linear-gradient(135deg, 
          rgba(250, 248, 243, 0.97) 0%, 
          rgba(245, 242, 237, 0.98) 100%
        );
        border-radius: 4px;
        box-shadow: 
          0 4px 20px rgba(0,0,0,0.08),
          inset 0 0 40px rgba(255,255,255,0.5);
        position: relative;
      }

      main::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.03;
        pointer-events: none;
        border-radius: 4px;
      }

      h1 {
        font-family: 'ZCOOL XiaoWei', serif;
        font-size: 2rem;
        color: #1a1a18;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid rgba(26, 26, 24, 0.15);
        text-align: center;
        letter-spacing: 0.3rem;
      }

      h2 {
        font-family: 'ZCOOL XiaoWei', serif;
        font-size: 1.4rem;
        color: #2a2520;
        margin: 2.5rem 0 1.2rem;
        padding-left: 1rem;
        border-left: 3px solid #2a2520;
      }

      h3 {
        font-family: 'ZCOOL XiaoWei', serif;
        font-size: 1.15rem;
        color: #3a3530;
        margin: 1.8rem 0 0.8rem;
      }

      p {
        margin-bottom: 1.6rem;
        text-align: justify;
        text-indent: 2em;
        font-size: 1rem;
        color: #3a3530;
      }

      a {
        color: #5a4a3a;
        text-decoration: none;
        border-bottom: 1px solid #8b7355;
        transition: all 0.3s ease;
      }

      a:hover {
        color: #c41e3a;
        border-bottom-color: #c41e3a;
      }

      code {
        background: rgba(0,0,0,0.04);
        padding: 0.1rem 0.3rem;
        border-radius: 2px;
        font-family: 'Courier New', monospace;
        font-size: 0.9em;
        color: #5a4a3a;
      }

      pre {
        background: #2a2520;
        color: #d4cfc5;
        padding: 1.2rem;
        border-radius: 4px;
        overflow-x: auto;
        margin: 1.5rem 0;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      pre code {
        background: none;
        color: inherit;
        padding: 0;
        font-size: inherit;
      }

      blockquote {
        background: rgba(26, 25, 24, 0.03);
        border-left: 3px solid #2a2520;
        padding: 1rem 1.5rem;
        margin: 1.5rem 0;
        font-style: italic;
        color: #5a5248;
      }

      blockquote::before {
        content: '"';
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 2.5rem;
        color: rgba(26, 25, 24, 0.1);
        line-height: 1;
        margin-right: 0.5rem;
      }

      .post-list {
        list-style: none;
        padding: 0;
      }

      .post-list li {
        padding: 1.2rem 0;
        border-bottom: 1px dashed rgba(26, 25, 24, 0.1);
        position: relative;
        padding-left: 1.2rem;
      }

      .post-list li::before {
        content: '·';
        position: absolute;
        left: 0;
        color: #4a4238;
        font-size: 1.3rem;
      }

      .post-list li:last-child {
        border-bottom: none;
      }

      .post-meta {
        color: #7a7268;
        font-size: 0.85rem;
        margin-bottom: 0.2rem;
        font-family: 'ZCOOL XiaoWei', serif;
      }

      .post-link {
        font-family: 'ZCOOL XiaoWei', serif;
        font-size: 1.1rem;
        border: none;
        color: #2a2520;
      }

      .post-link:hover {
        color: #c41e3a;
      }

      footer {
        text-align: center;
        padding: 2rem;
        margin-top: auto;
        background: linear-gradient(180deg, transparent 0%, rgba(245, 241, 235, 0.9) 100%);
      }

      footer p {
        text-align: center;
        text-indent: 0;
        margin-bottom: 0.3rem;
        color: #7a7268;
        font-size: 0.9rem;
      }

      .intro-box {
        background: rgba(26, 25, 24, 0.03);
        padding: 1.5rem;
        border-radius: 4px;
        margin: 1.5rem 0;
        text-align: center;
        border: 1px solid rgba(26, 25, 24, 0.08);
      }

      .intro-box p {
        text-indent: 0;
        text-align: center;
        margin-bottom: 0;
        color: #4a4238;
      }

      .landmark-section {
        margin: 2rem 0;
        padding: 1.5rem;
        background: rgba(26, 25, 24, 0.02);
        border-radius: 4px;
        border: 1px solid rgba(26, 25, 24, 0.06);
      }

      .landmark-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.2rem;
        margin-top: 1.2rem;
      }

      .landmark-card {
        background: rgba(255,255,255,0.5);
        padding: 1.2rem;
        border-radius: 4px;
        border: 1px solid rgba(26, 25, 24, 0.05);
        transition: all 0.3s ease;
      }

      .landmark-card:hover {
        background: rgba(255,255,255,0.8);
        box-shadow: 0 3px 10px rgba(0,0,0,0.06);
      }

      .landmark-card h3 {
        color: #3a3530;
        font-size: 1.1rem;
        margin-bottom: 0.6rem;
        margin-top: 0;
        border-bottom: 1px solid rgba(26, 25, 24, 0.1);
        padding-bottom: 0.4rem;
      }

      .landmark-card p {
        font-size: 0.9rem;
        color: #5a5248;
        text-indent: 0;
        margin-bottom: 0;
        text-align: left;
      }

      .spirit-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        margin-top: 1.5rem;
        text-align: center;
      }

      .spirit-item h3 {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 1.8rem;
        color: #2a2520;
        margin: 0;
        border: none;
        padding: 0;
      }

      .spirit-item p {
        font-size: 0.85rem;
        color: #7a7268;
        text-indent: 0;
        margin-top: 0.2rem;
      }

      .ink-separator {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 2rem auto;
        max-width: 300px;
      }

      .ink-separator::before,
      .ink-separator::after {
        content: '';
        flex: 1;
        height: 1px;
        background: linear-gradient(to right, transparent, rgba(26, 25, 24, 0.3), transparent);
      }

      .ink-separator span {
        padding: 0 1rem;
        font-size: 1.2rem;
        color: rgba(26, 25, 24, 0.3);
      }

      @media (max-width: 768px) {
        .site-title {
          font-size: 2.5rem;
          letter-spacing: 0.4rem;
        }
        nav {
          gap: 1.5rem;
          flex-wrap: wrap;
        }
        main {
          margin: 1rem;
          padding: 1.5rem;
        }
        .spirit-grid {
          grid-template-columns: 1fr;
        }
        .seal {
          width: 35px;
          height: 35px;
          font-size: 1rem;
        }
        .sun {
          width: 50px;
          height: 50px;
          top: 15%;
          right: 12%;
        }
      }
    </style>
  </head>
  <body>
    <div class="landscape">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="cloud cloud-4"></div>
      <div class="sun"></div>
      <div class="mountain mountain-far"></div>
      <div class="mountain mountain-mid"></div>
      <div class="mist"></div>
      <div class="mountain mountain-near"></div>
      <div class="water"></div>
      <div class="pine"></div>
      <div class="seal">曦</div>
    </div>

    <div class="content-wrapper">
      <header>
        <h1 class="site-title">墨小曦</h1>
        <p class="site-subtitle">记录生活 · 分享成长</p>
        <nav>
          {% for item in site.data.navigation %}
            <a href="{{ item.link }}">{{ item.name }}</a>
          {% endfor %}
        </nav>
      </header>

      <main>
        {{ content }}
      </main>

      <div class="ink-separator">
        <span>❋</span>
      </div>

      <footer>
        <p>© <span id="current-year"></span> 墨小曦的Blog</p>
