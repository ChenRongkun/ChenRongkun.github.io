<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600;700&family=ZCOOL+XiaoWei&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Noto Serif SC', serif;
        background: #f0ebe0;
        color: #3d3d3d;
        line-height: 2;
        min-height: 100vh;
        position: relative;
      }

      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
          radial-gradient(at 20% 30%, rgba(76, 76, 76, 0.03) 0%, transparent 50%),
          radial-gradient(at 80% 70%, rgba(76, 76, 76, 0.03) 0%, transparent 50%),
          url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        opacity: 0.4;
        pointer-events: none;
        z-index: -1;
      }

      .ink-text {
        font-family: 'Ma Shan Zheng', cursive;
      }

      .xiaowei-text {
        font-family: 'ZCOOL XiaoWei', serif;
      }

      header {
        background: transparent;
        padding: 3rem 2rem 2rem;
        text-align: center;
        position: relative;
      }

      .site-title {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 4rem;
        color: #2a2a2a;
        letter-spacing: 0.8rem;
        text-shadow: 3px 3px 6px rgba(0,0,0,0.1);
        margin-bottom: 0.5rem;
      }

      .site-subtitle {
        font-family: 'ZCOOL XiaoWei', serif;
        font-size: 1rem;
        color: #666;
        letter-spacing: 0.3rem;
      }

      nav {
        display: flex;
        justify-content: center;
        gap: 3rem;
        margin-top: 2rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid rgba(0,0,0,0.1);
      }

      nav a {
        text-decoration: none;
        color: #555;
        font-size: 1.1rem;
        padding: 0.3rem 1rem;
        position: relative;
        transition: all 0.3s ease;
      }

      nav a::before {
        content: '〇';
        position: absolute;
        left: -1.5rem;
        color: #999;
        opacity: 0.5;
        transition: all 0.3s ease;
      }

      nav a:hover {
        color: #2a2a2a;
      }

      nav a:hover::before {
        content: '●';
        color: #2a2a2a;
        opacity: 1;
      }

      .hero {
        text-align: center;
        padding: 4rem 2rem;
        position: relative;
      }

      .hero::before,
      .hero::after {
        content: '〰';
        position: absolute;
        font-size: 2rem;
        color: #ccc;
        letter-spacing: 2rem;
      }

      .hero::before {
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
      }

      .hero::after {
        bottom: 1rem;
        left: 50%;
        transform: translateX(-50%);
      }

      .hero h1 {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 3rem;
        color: #2a2a2a;
        letter-spacing: 0.5rem;
        margin-bottom: 1rem;
      }

      .hero p {
        font-size: 1.1rem;
        color: #777;
        max-width: 500px;
        margin: 0 auto;
      }

      .ink-separator {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 3rem auto;
        max-width: 400px;
      }

      .ink-separator::before,
      .ink-separator::after {
        content: '';
        flex: 1;
        height: 1px;
        background: linear-gradient(to right, transparent, #999, transparent);
      }

      .ink-separator span {
        padding: 0 1.5rem;
        font-size: 1.5rem;
        color: #999;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 3rem 2rem;
        background: rgba(255, 255, 255, 0.6);
        min-height: 50vh;
        backdrop-filter: blur(10px);
        border-radius: 4px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      }

      h1 {
        font-family: 'ZCOOL XiaoWei', serif;
        font-size: 2rem;
        color: #2a2a2a;
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid rgba(0,0,0,0.1);
        text-align: center;
        letter-spacing: 0.3rem;
      }

      h2 {
        font-family: 'ZCOOL XiaoWei', serif;
        font-size: 1.5rem;
        color: #3d3d3d;
        margin: 2.5rem 0 1.5rem;
        padding-left: 1rem;
        border-left: 3px solid #555;
      }

      h3 {
        font-family: 'ZCOOL XiaoWei', serif;
        font-size: 1.2rem;
        color: #555;
        margin: 2rem 0 1rem;
      }

      p {
        margin-bottom: 1.8rem;
        text-align: justify;
        text-indent: 2em;
        font-size: 1.05rem;
        color: #444;
      }

      a {
        color: #555;
        text-decoration: none;
        border-bottom: 1px solid #999;
        transition: all 0.3s ease;
      }

      a:hover {
        color: #2a2a2a;
        border-bottom-color: #2a2a2a;
      }

      code {
        background: rgba(0,0,0,0.05);
        padding: 0.15rem 0.4rem;
        border-radius: 2px;
        font-family: 'Courier New', monospace;
        font-size: 0.95em;
        color: #555;
      }

      pre {
        background: #2a2a2a;
        color: #d4d4d4;
        padding: 1.5rem;
        border-radius: 4px;
        overflow-x: auto;
        margin: 2rem 0;
        font-size: 0.95rem;
        line-height: 1.6;
      }

      pre code {
        background: none;
        color: inherit;
        padding: 0;
        font-size: inherit;
      }

      blockquote {
        background: rgba(0,0,0,0.03);
        border-left: none;
        padding: 1.5rem 2rem;
        margin: 2rem 0;
        font-style: italic;
        position: relative;
        color: #555;
      }

      blockquote::before {
        content: '"';
        position: absolute;
        top: 0;
        left: 0.5rem;
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 4rem;
        color: rgba(0,0,0,0.1);
        line-height: 1;
      }

      blockquote::after {
        content: '"';
        position: absolute;
        bottom: 0;
        right: 0.5rem;
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 4rem;
        color: rgba(0,0,0,0.1);
        line-height: 1;
      }

      blockquote p {
        text-indent: 0;
        margin-bottom: 0;
      }

      .post-list {
        list-style: none;
        padding: 0;
      }

      .post-list li {
        padding: 1.5rem 0;
        border-bottom: 1px dashed rgba(0,0,0,0.1);
        position: relative;
        padding-left: 1.5rem;
      }

      .post-list li::before {
        content: '·';
        position: absolute;
        left: 0;
        color: #777;
        font-size: 1.5rem;
      }

      .post-list li:last-child {
        border-bottom: none;
      }

      .post-meta {
        color: #999;
        font-size: 0.9rem;
        margin-bottom: 0.3rem;
        font-family: 'ZCOOL XiaoWei', serif;
      }

      .post-link {
        font-family: 'ZCOOL XiaoWei', serif;
        font-size: 1.2rem;
        border: none;
        color: #3d3d3d;
      }

      .post-link:hover {
        color: #1a1a1a;
      }

      footer {
        text-align: center;
        padding: 3rem 2rem;
        margin-top: 3rem;
        border-top: 1px solid rgba(0,0,0,0.1);
      }

      footer p {
        text-align: center;
        text-indent: 0;
        margin-bottom: 0.5rem;
        color: #888;
        font-size: 0.95rem;
      }

      .landmark-section {
        margin: 3rem 0;
        padding: 2rem;
        background: rgba(0,0,0,0.02);
        border-radius: 4px;
      }

      .landmark-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.5rem;
        margin-top: 1.5rem;
      }

      .landmark-card {
        background: rgba(255,255,255,0.5);
        padding: 1.5rem;
        border-radius: 4px;
        border: 1px solid rgba(0,0,0,0.05);
        transition: all 0.3s ease;
      }

      .landmark-card:hover {
        background: rgba(255,255,255,0.8);
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      }

      .landmark-card h3 {
        color: #444;
        font-size: 1.2rem;
        margin-bottom: 0.8rem;
        margin-top: 0;
        border-bottom: 1px solid rgba(0,0,0,0.1);
        padding-bottom: 0.5rem;
      }

      .landmark-card p {
        font-size: 0.95rem;
        color: #666;
        text-indent: 0;
        margin-bottom: 0;
        text-align: left;
      }

      .spirit-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        margin-top: 2rem;
        text-align: center;
      }

      .spirit-item h3 {
        font-family: 'Ma Shan Zheng', cursive;
        font-size: 2rem;
        color: #3d3d3d;
        margin: 0;
        border: none;
        padding: 0;
      }

      .spirit-item p {
        font-size: 0.9rem;
        color: #888;
        text-indent: 0;
        margin-top: 0.3rem;
      }

      .intro-box {
        background: rgba(0,0,0,0.02);
        padding: 2rem;
        border-radius: 4px;
        margin: 2rem 0;
        text-align: center;
      }

      .intro-box p {
        text-indent: 0;
        text-align: center;
        margin-bottom: 0;
      }

      @media (max-width: 768px) {
        .site-title {
          font-size: 2.5rem;
          letter-spacing: 0.3rem;
        }
        nav {
          gap: 1.5rem;
        }
        nav a {
          font-size: 1rem;
        }
        .hero h1 {
          font-size: 2rem;
        }
        main {
          margin: 1rem;
          padding: 1.5rem;
        }
        .spirit-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 class="site-title">墨小曦</h1>
      <p class="site-subtitle">云大 · 会泽百家 至公天下</p>
      <nav>
        {% for item in site.data.navigation %}
          <a href="{{ item.link }}">{{ item.name }}</a>
        {% endfor %}
      </nav>
    </header>

    {% if page.url == '/' %}
    <section class="hero">
      <h1>Blog</h1>
      <p>墨香浮动 · 记录成长</p>
    </section>
    {% endif %}

    <main>
      {{ content }}
    </main>

    <div class="ink-separator">
      <span>❋</span>
    </div>

    <footer>
      <p>© 2024 墨小曦的Blog</p>
      <p style="font-size: 0.85rem; color: #aaa;">云南大学 · 始于一九二二</p>
    </footer>
  </body>
</html>
