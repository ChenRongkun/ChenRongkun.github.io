<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Noto Serif SC', serif;
        background: #f5f5f0;
        color: #333;
        line-height: 1.8;
        min-height: 100vh;
      }

      .ink-text {
        font-family: 'ZCOOL XiaoWei', serif;
      }

      header {
        background: linear-gradient(to bottom, #fff 0%, #faf8f5 100%);
        padding: 2rem 3rem;
        border-bottom: 1px solid #d4c5b0;
        position: relative;
      }

      header::before {
        content: '云南大学';
        position: absolute;
        top: 50%;
        right: 3rem;
        transform: translateY(-50%);
        font-family: 'ZCOOL XiaoWei', serif;
        font-size: 1rem;
        color: #8b7355;
        letter-spacing: 0.5rem;
        opacity: 0.6;
      }

      nav {
        display: flex;
        gap: 2rem;
        align-items: center;
      }

      nav a {
        text-decoration: none;
        color: #4a4a4a;
        font-size: 1.1rem;
        padding: 0.5rem 1rem;
        border-radius: 4px;
        transition: all 0.3s ease;
        position: relative;
      }

      nav a::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 0;
        height: 2px;
        background: #8b4513;
        transition: all 0.3s ease;
        transform: translateX(-50%);
      }

      nav a:hover {
        color: #8b4513;
      }

      nav a:hover::after {
        width: 80%;
      }

      .hero {
        text-align: center;
        padding: 4rem 2rem;
        background: linear-gradient(to bottom, #fff 0%, #f5f5f0 100%);
        border-bottom: 1px solid #d4c5b0;
        position: relative;
        overflow: hidden;
      }

      .hero::before {
        content: '♾';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 20rem;
        opacity: 0.03;
        font-family: serif;
      }

      .hero h1 {
        font-family: 'ZCOOL XiaoWei', serif;
        font-size: 3rem;
        color: #2c2c2c;
        margin-bottom: 1rem;
        letter-spacing: 0.3rem;
      }

      .hero p {
        font-size: 1.2rem;
        color: #666;
        max-width: 600px;
        margin: 0 auto;
      }

      .ink-divider {
        width: 120px;
        height: 2px;
        background: linear-gradient(to right, transparent, #8b4513, transparent);
        margin: 2rem auto;
        position: relative;
      }

      .ink-divider::before {
        content: '☙';
        position: absolute;
        left: -20px;
        top: 50%;
        transform: translateY(-50%);
        color: #8b4513;
        font-size: 1.5rem;
      }

      .ink-divider::after {
        content: '❧';
        position: absolute;
        right: -20px;
        top: 50%;
        transform: translateY(-50%);
        color: #8b4513;
        font-size: 1.5rem;
      }

      main {
        max-width: 800px;
        margin: 0 auto;
        padding: 3rem 2rem;
        background: #fff;
        min-height: 60vh;
        box-shadow: 0 0 30px rgba(0,0,0,0.05);
        margin-top: 2rem;
        margin-bottom: 2rem;
        border-radius: 8px;
        position: relative;
      }

      main::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23000000' fill-opacity='0.02'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
        pointer-events: none;
        border-radius: 8px;
      }

      h1, h2, h3 {
        font-family: 'ZCOOL XiaoWei', serif;
        color: #2c2c2c;
        margin-bottom: 1.5rem;
      }

      h1 { font-size: 2.2rem; border-bottom: 2px solid #d4c5b0; padding-bottom: 1rem; }
      h2 { font-size: 1.8rem; color: #4a4a4a; }
      h3 { font-size: 1.4rem; color: #666; }

      p {
        margin-bottom: 1.5rem;
        text-align: justify;
        text-indent: 2em;
      }

      a {
        color: #8b4513;
        text-decoration: none;
        border-bottom: 1px dotted #8b4513;
        transition: all 0.3s ease;
      }

      a:hover {
        color: #d2691e;
        border-bottom-style: solid;
      }

      code {
        background: #f5f5f0;
        padding: 0.2rem 0.5rem;
        border-radius: 3px;
        font-family: 'Courier New', monospace;
        color: #8b4513;
      }

      pre {
        background: #2c2c2c;
        color: #f5f5f0;
        padding: 1.5rem;
        border-radius: 8px;
        overflow-x: auto;
        margin: 1.5rem 0;
      }

      pre code {
        background: none;
        color: inherit;
        padding: 0;
      }

      .post-list {
        list-style: none;
        padding: 0;
      }

      .post-list li {
        padding: 1.5rem 0;
        border-bottom: 1px dashed #d4c5b0;
        position: relative;
        padding-left: 2rem;
      }

      .post-list li::before {
        content: '•';
        position: absolute;
        left: 0;
        color: #8b4513;
        font-size: 1.5rem;
      }

      .post-list li:last-child {
        border-bottom: none;
      }

      .post-meta {
        color: #999;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
      }

      .post-link {
        font-size: 1.3rem;
        font-family: 'ZCOOL XiaoWei', serif;
        border: none;
      }

      .post-link:hover {
        color: #d2691e;
      }

      footer {
        text-align: center;
        padding: 2rem;
        background: #2c2c2c;
        color: #999;
        margin-top: 3rem;
      }

      footer p {
        text-align: center;
        text-indent: 0;
        margin: 0;
      }

      .about-section {
        display: flex;
        gap: 2rem;
        align-items: flex-start;
        margin: 2rem 0;
      }

      .about-content {
        flex: 1;
      }

      .scroll-hint {
        text-align: center;
        color: #999;
        font-size: 0.9rem;
        margin-top: 1rem;
        animation: bounce 2s infinite;
      }

      @keyframes bounce {
        0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-10px); }
        60% { transform: translateY(-5px); }
      }

      @media (max-width: 768px) {
        header {
          padding: 1rem;
          flex-direction: column;
        }
        header::before {
          display: none;
        }
        .hero h1 {
          font-size: 2rem;
        }
        main {
          margin: 1rem;
          padding: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        {% for item in site.data.navigation %}
          <a href="{{ item.link }}">{{ item.name }}</a>
        {% endfor %}
      </nav>
    </header>

    {% if page.url == '/' %}
    <section class="hero">
      <h1 class="ink-text">墨韵云大</h1>
      <div class="ink-divider"></div>
      <p>云南大学 · 始于一九二二</p>
      <p>会泽百家，至公天下</p>
    </section>
    {% endif %}

    <main>
      {{ content }}
    </main>

    <footer>
      <p>© 2024 墨韵云大 · 云南大学</p>
      <p style="margin-top: 0.5rem; font-size: 0.8rem;">会泽百家，至公天下</p>
    </footer>
  </body>
</html>
