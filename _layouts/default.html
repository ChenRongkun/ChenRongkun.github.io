<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
        line-height: 1.6;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }
      header {
        background: white;
        padding: 1rem 2rem;
        border-radius: 10px;
        margin-bottom: 2rem;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      nav a {
        margin-right: 1rem;
        text-decoration: none;
        color: #667eea;
        font-weight: bold;
      }
      main {
        background: white;
        padding: 2rem;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      footer {
        text-align: center;
        margin-top: 2rem;
        color: white;
      }
      h1 { color: #333; }
      h2 { color: #667eea; }
      a { color: #667eea; }
      code {
        background: #f4f4f4;
        padding: 0.2rem 0.4rem;
        border-radius: 3px;
      }
      .post-list {
        list-style: none;
        padding: 0;
      }
      .post-list li {
        padding: 0.5rem 0;
        border-bottom: 1px solid #eee;
      }
      .post-meta {
        color: #666;
        font-size: 0.9rem;
      }
      .post-content {
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        {% for item in site.data.navigation %}
          <a href="{{ item.link }}">{{ item.name }}</a>
        {% endfor %}
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer>
      <p>&copy; 2024 My Awesome Jekyll Blog</p>
    </footer>
  </body>
</html>
